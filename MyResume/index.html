<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Selvakumar M | Senior Software Developer</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Poppins:300,400,500,600,700" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; color: #272829; padding-top: 60px; }
    
    .navbar { background: #fff; box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1); padding: 15px 0; }
    .nav-link { color: #45505b; font-weight: 500; margin: 0 10px; transition: 0.3s; }
    .nav-link:hover, .nav-link.active { color: #0563bb; }
    .nav-link i { margin-right: 5px; }
    
    .social-links { margin-top: 25px; }
    .social-links a { font-size: 20px; display: inline-flex; justify-content: center; align-items: center; background: #0563bb; color: #fff; padding: 12px; margin: 0 5px; border-radius: 50%; width: 45px; height: 45px; transition: 0.3s; text-decoration: none; }
    .social-links a:hover { background: #0678e3; transform: scale(1.1); }
    
    #footer { background: #f4f6fd; padding: 30px 0; text-align: center; box-shadow: 0px -2px 15px rgba(0, 0, 0, 0.05); }
    #footer h3 { font-size: 32px; font-weight: 700; color: #45505b; margin-bottom: 15px; }
  </style>
</head>

<body>
  
  <!-- The Navigation Placeholder -->
  <div id="nav-placeholder"></div>

  <section id="hero">
    <div class="container">
      <h1>Selvakumar M</h1>
      <div class="typewriter">
        <p>I'm a <span>Senior Software Developer</span></p>
      </div>
      <!-- Tech Stack Highlights -->
      <div class="tech-stack-badges mt-4">
        <span class="tech-badge"><i class="fas fa-code"></i> .NET 8</span>
        <span class="tech-badge"><i class="fab fa-angular"></i> Angular</span>
        <span class="tech-badge"><i class="fas fa-database"></i> SQL Server</span>
      </div>
    </div>
  </section>

  <!-- The Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Required Scripts for Bootstrap and Menu Loading -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
