<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Contact | Selvakumar M</title>
  
  <!-- Upgraded to Bootstrap 5 & FontAwesome 6 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Poppins:300,400,500,600,700" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

  <style>
    /* Global & Navbar Styles (Consistent with index/about) */
    body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; color: #272829; padding-top: 70px; }
    .navbar { background: #fff; box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.1); padding: 15px 0; }
    .nav-link { color: #45505b; font-weight: 500; margin: 0 10px; transition: 0.3s; }
    .nav-link:hover, .nav-link.active { color: #0563bb; }
    .nav-link i { margin-right: 5px; }

    /* Contact Section Enhancements */
    .contact { padding: 60px 0; }
    .section-title h2 { font-size: 32px; font-weight: bold; margin-bottom: 40px; color: #45505b; text-align: center; }
    .info { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: 100%; }
    .info i { font-size: 20px; color: #0563bb; float: left; width: 44px; height: 44px; background: #eef7ff; display: flex; justify-content: center; align-items: center; border-radius: 50px; transition: all 0.3s ease-in-out; }
    .info h4 { padding: 0 0 0 60px; font-size: 20px; font-weight: 600; margin-bottom: 5px; color: #45505b; }
    .info p { padding: 0 0 10px 60px; margin-bottom: 20px; font-size: 14px; color: #728394; }
    .info .email p, .info .phone p { margin-bottom: 0; }
    
    /* Form Styles */
    .php-email-form { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .php-email-form .form-group { margin-bottom: 20px; }
    .php-email-form input, .php-email-form textarea { border-radius: 4px; box-shadow: none; font-size: 14px; padding: 10px 15px; }
    .php-email-form input:focus, .php-email-form textarea:focus { border-color: #0563bb; box-shadow: 0 0 0 0.2rem rgba(5, 99, 187, 0.25); }
    .php-email-form button[type="submit"] { background: #0563bb; border: 0; padding: 10px 30px; color: #fff; transition: 0.4s; border-radius: 50px; font-weight: 500; }
    .php-email-form button[type="submit"]:hover { background: #0678e3; }

    /* Footer Enhancements */
    #footer { background: #f4f6fd; padding: 30px 0; text-align: center; box-shadow: 0px -2px 15px rgba(0, 0, 0, 0.05); margin-top: 40px; }
    #footer h3 { font-size: 32px; font-weight: 700; color: #45505b; margin-bottom: 15px; }
    .social-links a { font-size: 20px; display: inline-flex; justify-content: center; align-items: center; background: #0563bb; color: #fff; padding: 12px; margin: 0 5px; border-radius: 50%; width: 45px; height: 45px; transition: 0.3s; text-decoration: none; }
    .social-links a:hover { background: #0678e3; transform: scale(1.1); }
  </style>
</head>

<body>
  
  <!-- The Navigation Placeholder -->
  <div id="nav-placeholder"></div>

  <section id="contact" class="contact">
    <div class="container">
      <div class="section-title">
        <h2>Contact Me</h2>
      </div>

      <div class="row mt-1">
        <div class="col-lg-4">
          <div class="info">
            <div class="address mb-4">
              <i class="fas fa-location-arrow"></i>
              <h4>Location:</h4>
              <p>Chennai, India - 600097</p>
            </div>

            <div class="email mb-4">
              <i class="fas fa-envelope"></i>
              <h4>Email:</h4>
              <p><a href="mailto:selvask2210@gmail.com" class="text-decoration-none text-secondary">selvask2210@gmail.com</a></p>
            </div>

            <div class="phone">
              <i class="fas fa-phone"></i>
              <h4>Call:</h4>
              <p><a href="tel:+919080229760" class="text-decoration-none text-secondary">+91 9080229760</a></p>
            </div>
          </div>
        </div>

        <div class="col-lg-8 mt-5 mt-lg-0">
          <!-- Form action successfully linked to Formspree -->
          <form action="https://formspree.io/f/xeaoobld" method="POST" class="php-email-form">
            <div class="row">
              <div class="col-md-6 form-group">
                <input type="text" name="name" class="form-control" id="name" placeholder="Your Name" required />
              </div>
              <div class="col-md-6 form-group">
                <input type="email" class="form-control" name="email" id="email" placeholder="Your Email" required />
              </div>
            </div>
            <div class="form-group">
              <input type="text" class="form-control" name="subject" id="subject" placeholder="Subject" required />
            </div>
            <div class="form-group">
              <textarea class="form-control" name="message" rows="5" placeholder="Message" required></textarea>
            </div>
            <div class="text-center"><button type="submit">Send Message</button></div>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- The Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
